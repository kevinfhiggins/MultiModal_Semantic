<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #2c3e50;
        }

        #controls {
            background: #34495e;
            padding: 10px;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        #controls button {
            padding: 8px 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        #controls button:hover {
            background: #2980b9;
        }

        #controls button:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }

        #page-info {
            margin-left: auto;
            font-weight: 600;
        }

        #pdf-container {
            width: 100%;
            height: calc(100vh - 50px);
            overflow: auto;
            background: #2c3e50;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        #pdf-canvas {
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            background: white;
            max-width: 100%;
        }

        #text-layer {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            opacity: 0.2;
            line-height: 1.0;
        }

        #text-layer > span {
            color: transparent;
            position: absolute;
            white-space: pre;
            cursor: text;
            transform-origin: 0% 0%;
        }

        .highlight {
            background-color: yellow;
            opacity: 0.4;
        }

        #canvas-wrapper {
            position: relative;
            display: inline-block;
        }

        .loading {
            color: white;
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="prev-btn">◀ Previous</button>
        <button id="next-btn">Next ▶</button>
        <input type="number" id="page-input" min="1" style="width: 60px; padding: 5px;">
        <button id="go-btn">Go</button>
        <span id="page-info">Loading...</span>
    </div>
    <div id="pdf-container">
        <div id="canvas-wrapper">
            <canvas id="pdf-canvas"></canvas>
            <div id="text-layer"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Set worker source
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const pdfUrl = urlParams.get('file');
        const targetPage = parseInt(urlParams.get('page') || '1');
        const searchQuery = urlParams.get('query') || '';

        let pdfDoc = null;
        let pageNum = targetPage;
        let pageRendering = false;
        let pageNumPending = null;
        let scale = 1.5;
        let canvas = null;
        let ctx = null;

        // Highlight matching text
        function highlightText(textContent, viewport) {
            const textLayer = document.getElementById('text-layer');
            textLayer.innerHTML = ''; // Clear previous highlights

            const searchTerms = searchQuery.toLowerCase().split(' ');
            const canvasWrapper = document.getElementById('canvas-wrapper');

            textContent.items.forEach(function(textItem) {
                const text = textItem.str.toLowerCase();
                const hasMatch = searchTerms.some(term => text.includes(term));

                if (hasMatch) {
                    // Create highlight overlay
                    const tx = pdfjsLib.Util.transform(viewport.transform, textItem.transform);
                    const fontSize = Math.sqrt((tx[2] * tx[2]) + (tx[3] * tx[3]));

                    const highlight = document.createElement('div');
                    highlight.style.position = 'absolute';
                    highlight.style.left = tx[4] + 'px';
                    highlight.style.top = (tx[5] - fontSize) + 'px';
                    highlight.style.fontSize = fontSize + 'px';
                    highlight.style.width = (textItem.width * viewport.scale) + 'px';
                    highlight.style.height = fontSize + 'px';
                    highlight.style.backgroundColor = '#00FF00'; // Luminous lime
                    highlight.style.opacity = '0.5';
                    highlight.style.pointerEvents = 'none';

                    textLayer.appendChild(highlight);
                }
            });
        }

        // Render page
        function renderPage(num) {
            pageRendering = true;

            // Get fresh canvas reference
            canvas = document.getElementById('pdf-canvas');
            ctx = canvas.getContext('2d');

            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({scale: scale});
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                const renderTask = page.render(renderContext);

                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }

                    // Extract and highlight text if search query exists
                    if (searchQuery) {
                        page.getTextContent().then(function(textContent) {
                            highlightText(textContent, viewport);
                        });
                    }
                });
            });

            // Update page info
            document.getElementById('page-info').textContent = `Page ${num} of ${pdfDoc.numPages}`;
            document.getElementById('page-input').value = num;

            // Update button states
            document.getElementById('prev-btn').disabled = (num <= 1);
            document.getElementById('next-btn').disabled = (num >= pdfDoc.numPages);
        }

        // Queue page rendering
        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        // Previous page
        document.getElementById('prev-btn').addEventListener('click', function() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        });

        // Next page
        document.getElementById('next-btn').addEventListener('click', function() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        });

        // Go to page
        document.getElementById('go-btn').addEventListener('click', function() {
            const page = parseInt(document.getElementById('page-input').value);
            if (page >= 1 && page <= pdfDoc.numPages) {
                pageNum = page;
                queueRenderPage(pageNum);
            }
        });

        // Enter key on input
        document.getElementById('page-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('go-btn').click();
            }
        });

        // Load PDF
        console.log('PDF URL:', pdfUrl);
        console.log('Target page:', targetPage);
        console.log('Search query:', searchQuery);

        if (!pdfUrl) {
            document.getElementById('pdf-container').innerHTML =
                '<div class="loading">❌ No PDF file specified</div>';
        } else {
            document.getElementById('pdf-container').innerHTML =
                '<div class="loading">📄 Loading PDF...</div>';

            console.log('Starting PDF load...');

            const loadingTask = pdfjsLib.getDocument(pdfUrl);

            loadingTask.promise.then(function(pdf) {
                console.log('PDF loaded successfully, pages:', pdf.numPages);
                pdfDoc = pdf;
                document.getElementById('pdf-container').innerHTML = `
                    <div id="canvas-wrapper">
                        <canvas id="pdf-canvas"></canvas>
                        <div id="text-layer"></div>
                    </div>
                `;

                // Render the target page
                renderPage(pageNum);

            }).catch(function(error) {
                console.error('Error loading PDF:', error);
                document.getElementById('pdf-container').innerHTML =
                    '<div class="loading">❌ Error loading PDF: ' + error.message + '</div>';
            });
        }
    </script>
</body>
</html>
